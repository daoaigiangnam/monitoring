services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monitoring}
      MYSQL_USER: ${MYSQL_USER:-monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      NODE_ENV: ${APP_ENV:-development}
      PORT: ${API_PORT:-8080}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monitoring}
      MYSQL_USER: ${MYSQL_USER:-monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-replace-me}
      AGENT_HMAC_SECRET: ${AGENT_HMAC_SECRET:-replace-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: php:8.3-apache
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.local}
    ports:
      - "8088:80"
    volumes:
      - ./frontend:/var/www/html:ro
    depends_on:
      - api

volumes:
  mysql_data:
