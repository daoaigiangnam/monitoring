services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-monitoring}
      MYSQL_USER: ${DB_USER:-monitor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-monitoring}
      DB_USER: ${DB_USER:-monitor}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    image: php:8.3-apache
    restart: unless-stopped
    environment:
      MONITOR_API_URL: http://api:3000
    volumes:
      - ./frontend:/var/www/html:ro
    depends_on:
      - api
    ports:
      - "${PHP_PORT:-8080}:80"

volumes:
  mysql_data:
