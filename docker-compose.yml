services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-monitoring}
      MYSQL_USER: ${DB_USER:-monitor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/migrations/004_health_sla.sql:/docker-entrypoint-initdb.d/04-health-sla.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-monitoring}
      DB_USER: ${DB_USER:-monitor}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    build: ./api
    restart: unless-stopped
    command: ["npm","run","worker"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-monitoring}
      DB_USER: ${DB_USER:-monitor}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AGENT_STALE_SEC: ${AGENT_STALE_SEC:-180}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
      CHECK_RETENTION_DAYS: ${CHECK_RETENTION_DAYS:-30}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-180}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: php:8.3-apache
    restart: unless-stopped
    environment:
      MONITOR_API_URL: http://api:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-monitoring}
      DB_USER: ${DB_USER:-monitor}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - ./frontend:/var/www/html:ro
    depends_on:
      - api
      - mysql
    ports:
      - "${PHP_PORT:-8080}:80"

volumes:
  mysql_data:
